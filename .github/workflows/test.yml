name: test
# Runs on every push and pull request: on a public repository the minutes are free. It can still be
# started by hand (Actions tab → test → Run workflow). Pull requests from forks run as "pull_request",
# never "pull_request_target": their code gets no secrets and a read-only token.
on:
  push:
  pull_request:
  workflow_dispatch:
# The tests only read the repository: the token GitHub gives the job can do no more than that.
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      # Every system reports its own result: one failure does not cancel the other five.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to a commit, not to a tag that can be moved; the tag is in the comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
